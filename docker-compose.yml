services:
  app:
    build: .
    # Fixed tag instead of the folder name Compose would otherwise derive, so the image is
    # named reproducibly regardless of the checkout directory name.
    image: hybrid-pqc-tls-poc:latest
    # One-shot CLI demo run: hybrid PQC TLS 1.3 handshake (X25519MLKEM768) over loopback
    # sockets, software backend (BCJSSE). The IBM-CCA backend path (profile "ibm-cca") isn't
    # meaningfully containerizable here - see README.md.
